name: Cue
options:
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # VENDORED with two Cue patches (see "CUE PATCH" comments): a
  # lost-wakeup fix in MEPlayerItem's reader teardown and a display-link
  # invalidation on engine swap in KSPlayerLayer — together they stop a dead
  # engine leaking ~400-500 MB per swap (jetsam killer on the 3 GB boxes).
  # Base revision: 10a40a1c0001d75307ad5922d1d1bc0cb01c89b4.
  KSPlayer:
    path: Vendor/KSPlayer
  # Pure-Swift YouTube stream extractor — the only way to play trailer
  # YouTube keys on tvOS (no WebKit/WKWebView, so no iframe embed).
  #
  # VENDORED with one Cue patch (see the "CUE PATCH" comment in
  # YouTube.swift): `streams` used to abort on an unreadable watch page before
  # it had tried a single extraction method, which took the remote extractor
  # down with it even though that one never touches the watch page. An
  # unreadable page is what YouTube serves an address it distrusts, so this is
  # what made trailers stop working the moment a VPN was switched on.
  # Base revision: e5b7d0396ce12bf3444f0d209e8436c83373b7af (tag 0.4.9).
  YouTubeKit:
    path: Vendor/YouTubeKit
  # VLCKit as a binary xcframework; the tvOS slice vends module `TVVLCKit`.
  # Adds the VLC playback engine alongside KSPlayer.
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0
targets:
  Cue:
    type: application
    platform: tvOS
    sources:
      - Cue
    dependencies:
      - package: KSPlayer
      - package: YouTubeKit
      - package: VLCKit
        product: VLCKitSPM
      # libdovi (quietvoid/dovi_tool's dolby_vision crate, C API) —
      # cross-compiled Rust static lib for tvOS. Powers Dolby Vision
      # Profile 7 (dual-layer) → 8.1 RPU conversion so DV7 remuxes get
      # native DV output instead of the HDR10 base-layer tone-map.
      - framework: Vendor/libdovi.xcframework
        embed: false
      # ─── Top Shelf (Continue Watching on the tvOS home screen) ───
      # Needs the app group `group.app.cue.tv`. AppGroupResolver reads the
      # group from the LIVE entitlement at runtime, so a re-signing tool that
      # swaps in its own group still works; if a signer strips it entirely,
      # the shelf stays empty without affecting the app. Three spots, all
      # marked TOP SHELF, move together.
      - target: CueTopShelf
    info:
      path: Config/Info.plist
      properties:
        # The name on the Home Screen (the fork's own; internal names stay).
        CFBundleDisplayName: "Cue"
        # tvOS apps omit this by default, but Sideloadly's iOS-derived IPA
        # validator (Cydia Impactor lineage) rejects a bundle without it as
        # "not a valid iOS app". Harmless on tvOS (ignored); the binary stays a
        # real AppleTVOS/arm64 app and installs to the Apple TV normally.
        LSRequiresIPhoneOS: true
        # Version, from the build settings below rather than xcodegen's "1.0"/"1"
        # defaults — those literals landed in Config/Info.plist and MARKETING_VERSION
        # was never used, so About reported "Version 1.0 (1)" on every build.
        # Same place the (disabled) Top Shelf target sets its version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        # Picture in Picture keeps rendering while the app is not frontmost, and
        # AVKit refuses to start PiP at all without the audio background mode.
        UIBackgroundModes:
          - audio
        # Plus Jakarta Sans — bundled for the Stremio theme's chrome typography.
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-Bold.ttf
        # Deep links: cue:// (open a title) + stremio:// (install an addon).
        CFBundleURLTypes:
          - CFBundleURLName: app.cue.deeplink
            CFBundleURLSchemes:
              - cue
              - stremio
          # Install-unique callback scheme (the bundle id). `cue` is
          # claimed by every sideload of this app on the box, so Infuse's
          # x-success and the Top Shelf deep links used to land in whichever
          # one tvOS preferred. AppCallbackScheme reads this back at runtime;
          # DeepLinkService accepts it alongside `cue`.
          - CFBundleURLName: app.cue.callback
            CFBundleURLSchemes:
              - "$(PRODUCT_BUNDLE_IDENTIFIER)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # The app's identity, owned by this machine's team. Changing it makes
        # tvOS install a separate app with its own (empty) local data.
        PRODUCT_BUNDLE_IDENTIFIER: app.cue.tv
        # Signing team for device builds, HERE rather than only in the
        # generated pbxproj: Xcode's GUI writes the team into project.pbxproj,
        # where any xcodegen regeneration (or a git checkout of the file)
        # silently drops it — and a device build then dies with "Signing for
        # 'Cue' requires a development team".
        DEVELOPMENT_TEAM: C4KX5GHQ8V
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        # Tracks the Android APK release this port mirrors (v0.7.15-beta).
        MARKETING_VERSION: "9"
        CURRENT_PROJECT_VERSION: "1"
        # The sanitize script below writes into the built .app, so user
        # script sandboxing must be off or the phase is denied file access.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # ─── TOP SHELF (2 of 3) ─── App group entitlement, shared with the
        # extension. Both sides must name the SAME group or the container
        # they each resolve is a different directory and the shelf is empty.
        CODE_SIGN_ENTITLEMENTS: Config/Cue.entitlements
      configs:
        # Debug signs with the same id as Release. An app EXTENSION cannot be
        # signed with a wildcard profile, so the Top Shelf needs its own
        # explicit App ID (`app.cue.tv.topshelf`); one pair of ids keeps a
        # free Personal Team inside its ten-App-IDs-per-week quota.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Cue-Debug.entitlements
    preBuildScripts:
      # FFmpegKit (pulled in transitively by KSPlayer) ships
      # libshaderc_combined.framework with an underscore in its
      # CFBundleIdentifier (com.kintan.ksplayer.libshaderc_combined) —
      # illegal, and Xcode's embed validation rejects it. The post-build
      # sanitize phase below loses that race whenever the embed step
      # actually re-copies the framework (any clean build, or a build
      # setting change dirtying the embed): validation fails the build
      # before any post-build script runs. So fix the id at the SOURCE —
      # the SPM checkout — before anything is compiled or embedded. Runs
      # every build, so it also self-heals after a package re-resolve
      # recreates the checkout with the bad id. Needs
      # ENABLE_USER_SCRIPT_SANDBOXING=false (already set project-wide).
      - name: "Fix vendor framework bundle IDs at the source"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          CHECKOUTS="${BUILD_DIR%/Build/Products}/SourcePackages/checkouts"
          [ -d "$CHECKOUTS" ] || exit 0
          find "$CHECKOUTS" -path "*tvos*" -name Info.plist -path "*.framework/*" \
          | while read -r plist; do
            bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || true)
            case "$bid" in
              *_*)
                chmod u+w "$plist" 2>/dev/null || true
                newbid=$(printf '%s' "$bid" | tr '_' '-')
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newbid" "$plist" \
                  && echo "note: fixed checkout bundle id $bid -> $newbid" || true
                ;;
            esac
          done
    postBuildScripts:
      # Belt to the pre-build phase's suspenders: if a framework with an
      # underscore id still reaches the app bundle (a non-SPM framework,
      # or a package layout the source fix doesn't cover), rewrite and
      # re-sign the embedded copy too.
      - name: "Sanitize embedded framework bundle IDs"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          FW_DIR="${CODESIGNING_FOLDER_PATH}/Frameworks"
          [ -d "$FW_DIR" ] || exit 0
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for fw in "$FW_DIR"/*.framework; do
            plist="$fw/Info.plist"
            [ -f "$plist" ] || continue
            bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || true)
            case "$bid" in
              *_*)
                newbid=$(printf '%s' "$bid" | tr '_' '-')
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newbid" "$plist"
                codesign --force --sign "$IDENTITY" --timestamp=none "$fw"
                echo "note: sanitized bundle id $bid -> $newbid"
                ;;
            esac
          done
  # ─── TOP SHELF (3 of 3) ─── The extension target itself. Renders
  # Continue Watching on the tvOS home screen (Android's "Watch Next"
  # equivalent); reads a JSON snapshot from the shared app group written
  # by TopShelfExporter. Moves together with the other two TOP SHELF spots.
  CueTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - CueTopShelf
      - path: Cue/Core/AppGroupResolver.swift
        buildPhase: sources
    info:
      path: CueTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Cue
        # From the build setting, not a literal: the app's own version keys
        # were hardcoded here once and went stale silently.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
    settings:
      base:
        # MUST stay prefixed by the app's id or the build fails validation
        # with "embedded binary's bundle identifier is not prefixed with the
        # parent app's". Moves together with the app's id.
        PRODUCT_BUNDLE_IDENTIFIER: app.cue.tv.topshelf
        DEVELOPMENT_TEAM: C4KX5GHQ8V
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "9"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: CueTopShelf/CueTopShelf.entitlements
      configs:
        Debug:
          # Same id as Release; only the entitlements file differs.
          CODE_SIGN_ENTITLEMENTS: CueTopShelf/CueTopShelf-Debug.entitlements
schemes:
  Cue:
    build:
      targets:
        Cue: all
    run:
      config: Debug
      # KSPlayer's Metal renderer (MetalRender.textures) calls makeTexture and
      # tolerates a nil result via compactMap — fine on device. But the SIMULATOR
      # Debug run enables Metal API Validation, which ASSERTS (SIGABRT) on the
      # same texture instead of returning nil, crashing the app whenever a video
      # plays in the sim. Turn the validation layers off so the sim behaves like
      # the device (drop the frame, don't abort). No effect on real hardware.
      environmentVariables:
        - variable: MTL_DEBUG_LAYER
          value: "0"
          isEnabled: true
        - variable: MTL_SHADER_VALIDATION
          value: "0"
          isEnabled: true
